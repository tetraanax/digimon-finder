<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320">
  <!-- 파트너 없이 여행을 떠나는 사람: 직접 그린 단순한 실루엣 (흰 배경은 진화 연출에서 오려 내요) -->
  <rect width="240" height="320" fill="#ffffff"/>
  <g stroke="#0b1022" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 다리 -->
    <path d="M100 196 L94 292 L80 300 L110 300 L118 214 L122 214 L130 300 L160 300 L146 292 L140 196 Z" fill="#1e293b"/>
    <!-- 몸통 · 팔 (재킷) -->
    <path d="M86 104 Q120 92 154 104 L176 182 Q178 194 168 196 L160 194 L150 140 L148 202 L92 202 L90 140 L80 194 L72 196 Q62 194 64 182 Z" fill="#334155"/>
    <path d="M120 104 L120 200" fill="none" stroke-width="3"/>
    <!-- 목 · 머리 -->
    <path d="M110 86 L130 86 L128 104 L112 104 Z" fill="#cbd5e1"/>
    <circle cx="120" cy="62" r="30" fill="#e2e8f0"/>
    <!-- 머리카락 -->
    <path d="M90 60 Q92 26 124 30 Q152 32 151 62 Q140 46 120 48 Q104 48 90 60 Z" fill="#0f172a"/>
  </g>
  <!-- 손에 쥔 디바이스 -->
  <rect x="160" y="182" width="20" height="26" rx="5" fill="#f97316" stroke="#0b1022" stroke-width="4"/>
  <rect x="165" y="188" width="10" height="9" rx="2" fill="#fde68a"/>
</svg>
